apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx1-deployment
  namespace: privado
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx1
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: nginx1-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx1-html
  namespace: privado
data:
  index.html: |
    <html>
    <head><title>Nginx 1</title></head>
    <body>
      <h1>Hola NGINX1</h1>
    </body>
    </html>

---