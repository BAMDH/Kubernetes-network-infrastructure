apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Values.namespace.public }}
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    Listen 80
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule authn_core_module modules/mod_authn_core.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so

    ServerName localhost

    # Include VirtualHosts
    Include conf/extra/httpd-vhosts.conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-vhost
  namespace: {{ .Values.namespace.public }}
data:
  httpd-vhosts.conf: |
    <VirtualHost *:80>
        ProxyRequests Off
        ProxyPreserveHost On

        # Redirigir según path
        ProxyPass "/Nginx1/" "http://nginx1-service.{{ .Values.namespace.private }}.svc.cluster.local/"
        ProxyPassReverse "/Nginx1/" "http://nginx1-service.{{ .Values.namespace.private }}.svc.cluster.local/"

        ProxyPass "/Nginx2/" "http://nginx2-service.{{ .Values.namespace.private }}.svc.cluster.local/"
        ProxyPassReverse "/Nginx2/" "http://nginx2-service.{{ .Values.namespace.private }}.svc.cluster.local/"
    </VirtualHost>
