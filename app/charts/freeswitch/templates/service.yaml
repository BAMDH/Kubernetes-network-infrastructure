apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.freeswitch.name }}
  namespace: {{ .Values.freeswitch.namespace }}
spec:
  type: {{ .Values.freeswitch.service }}
  selector:
    app: {{ .Values.freeswitch.name }}
  ports:
  - name: sip-udp
    protocol: UDP
    port: 5060
    targetPort: 5060
  - name: sip-alt-udp
    protocol: UDP
    port: 5080
    targetPort: 5080
  - name: esl
    protocol: TCP
    port: 8021
    targetPort: 8021
  - name: sip-tcp
    protocol: TCP
    port: 5060
    targetPort: 5060
  - name: sip-alt-tcp
    protocol: TCP
    port: 5080
    targetPort: 5080
