apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.freeswitch.name }}-deployment
  namespace: {{ .Values.freeswitch.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.freeswitch.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.freeswitch.name }}
    spec:
      containers:
        - name: {{ .Values.freeswitch.name }}
          image: {{ .Values.freeswitch.image }}
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-alt-udp
              containerPort: 5080
              protocol: UDP
            - name: esl
              containerPort: 8021
              protocol: TCP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
            - name: sip-alt-tcp
              containerPort: 5080
              protocol: TCP
          env:
            - name: SOUND_RATES
              value: "8000:16000"
            - name: SOUND_TYPES
              value: "music:en-us-callie"
          volumeMounts:
            - name: {{ .Values.freeswitch.name }}-config-volume
              mountPath: /etc/freeswitch/autoload_configs/event_socket.conf.xml
              subPath: event_socket.conf.xml
            - name: {{ .Values.freeswitch.name }}-config-volume
              mountPath: /etc/freeswitch/directory/default/users.xml
              subPath: users.xml
            - name: {{ .Values.freeswitch.name }}-config-volume
              mountPath: /etc/freeswitch/dialplan/default/default.xml
              subPath: default.xml
      volumes:
        - name: {{ .Values.freeswitch.name }}-config-volume
          configMap:
            name: {{ .Values.freeswitch.name }}-config
