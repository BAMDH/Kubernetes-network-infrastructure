apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nginx1.name }}-service
  namespace: {{ .Values.nginx1.namespace }}
spec:
  selector:
    app: {{ .Values.nginx1.name }}
  ports:
    - port: {{ .Values.nginx1.port }}
      targetPort: {{ .Values.nginx1.port }}
  type: {{ .Values.nginx1.service }}