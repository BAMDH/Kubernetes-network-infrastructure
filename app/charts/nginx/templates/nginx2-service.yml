apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nginx2.name }}-service
  namespace: {{ .Values.nginx2.namespace }}
spec:
  selector:
    app: {{ .Values.nginx2.name }}
  ports:
    - port: {{ .Values.nginx2.port }}
      targetPort: {{ .Values.nginx2.port }}
  type: {{ .Values.nginx2.service }}