apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nginx1.name }}-deployment
  namespace: {{ .Values.nginx1.namespace }}
spec:
  replicas: {{ .Values.nginx1.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.nginx1.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nginx1.name }}
    spec:
      containers:
      - name: {{ .Values.nginx1.name }}
        image: {{ .Values.nginx1.image }}
        ports:
        - containerPort: {{ .Values.nginx1.port }}
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: {{ .Values.nginx1.name }}-html

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nginx1.name }}-html
  namespace: privado
data:
  index.html: |
    <html>
    <head><title>Nginx 1</title></head>
    <body>
      <h1>Hola NGINX1</h1>
    </body>
    </html>

---