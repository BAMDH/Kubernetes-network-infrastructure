apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.deploymentName }}-svc
  namespace: {{ .Values.namespace }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.deploymentName }}
  ports:
{{- range .Values.ports }}
    - name: http{{ .containerPort }}
      port: {{ .servicePort }}
      targetPort: {{ .containerPort }}
     
{{- end }}
