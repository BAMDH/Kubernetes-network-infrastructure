apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
    spec:
      containers:
      - name: {{ .Values.deploymentName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
        
        ports:
{{- range .Values.ports }}
          - containerPort: {{ .containerPort }}
            protocol: {{ .protocol }}
{{- end }}

        command:
          - /bin/bash
          - -c
          - |
            #tablas
            nft add table ip nat
            nft add table ip filter

            #cadenas maneja redireccion
            nft add chain ip nat prerouting '{ type nat hook prerouting priority 0 ; }'
            nft add chain ip nat postrouting '{ type nat hook postrouting priority 100 ; }'
            nft add chain ip nat output '{ type nat hook output priority 0 ; }'
           
            nft add chain ip filter forward '{ type filter hook forward priority 0; }'

            #reglas
            nft add rule ip nat postrouting oifname "eth0" masquerade
            #nft add rule ip filter forward accept


            {{- range .Values.ports }}
            nft add rule ip nat prerouting {{ .protocol | lower }} dport {{ .containerPort }} dnat to {{ .forwardTo }}
            nft add rule ip nat output {{ .protocol | lower }} dport {{ .containerPort }} dnat to {{ .forwardTo }}
            {{- end }}

          
            nft list ruleset
            tail -f /dev/null