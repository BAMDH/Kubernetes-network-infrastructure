deploymentName: router
namespace: publico
replicas: 1

image:
  repository: bamd/centos-nftables
  tag: "latest"
  #sirve para indicar las veces que se descarga la imagen, en este caso solamente si no está presente
  pullPolicy: IfNotPresent

ports:
  #nginx1
  - containerPort: 8080
    servicePort: 8080
    forwardTo: nginx1-service.privado.svc.cluster.local:80
  #nginx2
  - containerPort: 8081
    servicePort: 8081
    forwardTo: nginx2-service.privado.svc.cluster.local:80
replicas: 1
