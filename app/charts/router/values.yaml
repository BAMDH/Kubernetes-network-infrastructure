deploymentName: router
namespace: publico
replicas: 1

image:
  repository: bamd/centos-nftables
  tag: "latest"
  #sirve para indicar las veces que se descarga la imagen, en este caso solamente si no está presente
  pullPolicy: IfNotPresent


ports:
  #nginx1
  - containerPort: 8080
    servicePort: 8080
    nodePort: 30080
    protocol: TCP
    forwardTo: nginx1-service.privado.svc.cluster.local:80
  #nginx2
  - containerPort: 8081
    servicePort: 8081
    nodePort: 30081
    protocol: TCP
    forwardTo: nginx2-service.privado.svc.cluster.local:80
  #ingress controller
  - containerPort: 80
    servicePort: 80
    nodePort: 30083
    protocol: TCP
    forwardTo: ingress-controller-service.publico.svc.cluster.local:80
  #freewsitch  
  - containerPort: 9090
    servicePort: 9090
    nodePort: 30084
    protocol: TCP
    forwardTo: freeswitch.privado.svc.cluster.local:5060

  - containerPort: 9091
    servicePort: 9091
    nodePort: 30085
    protocol: UDP
    forwardTo: freeswitch.privado.svc.cluster.local:5060
replicas: 1
