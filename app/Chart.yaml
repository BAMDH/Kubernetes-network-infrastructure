apiVersion: v2
name: app
description: A Helm chart for Kubernetes
type: application
version: 0.1.0
appVersion: "1.16.0"

# Dependencias a subcharts
dependencies:
- name: freeswitch
  version: 1.0.0
  repository: "file://charts/freeswitch"
  condition: freeswitch.enabled

- name: ingress-controller
  version: 1.0.0
  repository: "file://charts/ingress-controller"
  condition: ingress_controller.enabled

- name: nginx
  version: 1.0.0
  repository: "file://charts/nginx"
  condition: nginx.enabled

- name: router
  version: 1.0.0
  repository: "file://charts/router"
  condition: router.enabled
